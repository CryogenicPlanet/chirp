app = "chirp-cloud"
primary_region = "sjc"

[build]
dockerfile = "Dockerfile"

[deploy]
# Migrations hold one transaction-scoped advisory lock and commit their receipt with the DDL.
release_command = "bun src/migrate-command.ts"
strategy = "immediate"

[env]
CLOUD_CLIENT_IP_HEADER = "fly-client-ip"
FLY_ORGANIZATION = "rahul-tarak"
FLY_REGION = "sjc"
BOARDS_DOMAIN = "boards.chirp.wiki"
FLY_VOLUME_SIZE_GB = "5"
# PostHog project tokens are public: they only authorize sending events.
POSTHOG_PROJECT_TOKEN = "phc_pA7gr5CLPuEbwNPvcyZH7Tkbf7vWnw83jZdZdEaPycDm"
POSTHOG_HOST = "https://us.i.posthog.com"

[http_service]
internal_port = 8080
force_https = true
# The provisioning worker must keep running between dashboard requests.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"
