app = "chirp-signin"
primary_region = "sjc"

[build]
dockerfile = "Dockerfile"

[deploy]
strategy = "immediate"

[env]
SIGNIN_ISSUER = "https://auth.chirp.wiki"

[http_service]
internal_port = 8080
force_https = true
# Codes are single-use per process, so exactly one machine runs, always.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "5s"
interval = "15s"
method = "GET"
path = "/health"
timeout = "2s"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
