name: Deploy Signin

# auth.chirp.wiki follows master. Once master's Signin workflow passes, deploy it to Fly. It runs as exactly
# one machine: codes are single-use within one process. Until the FLY_SIGNIN_API_TOKEN secret exists (owner
# setup, packages/signin/docs/README.md), the run succeeds without deploying.
on:
  workflow_run:
    workflows: [Signin]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-signin
  cancel-in-progress: false

jobs:
  token:
    name: Check deploy token and commit
    # Push events only: never deploy a pull request's code with production credentials.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      # A job-level if cannot read secrets, so this step reports only whether to deploy. A re-run of an older
      # Signin run keeps its old commit, so only the newest master run deploys; anything else would roll back.
      - id: check
        env:
          TOKEN: ${{ secrets.FLY_SIGNIN_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/signin.yml/runs?branch=master&event=push&per_page=1" --jq '.workflow_runs[0].head_sha')
          if [ -z "$TOKEN" ]; then
            echo "::notice::FLY_SIGNIN_API_TOKEN not set; skipping deploy (see packages/signin/docs/README.md)"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$newest" != "$HEAD_SHA" ]; then
            echo "::notice::A newer Signin run exists for $newest; not deploying $HEAD_SHA"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy sign-in issuer
    needs: token
    if: needs.token.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0
        with:
          version: 0.4.95
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SIGNIN_API_TOKEN }}
        run: >
          flyctl deploy --config packages/signin/fly.toml --dockerfile packages/signin/Dockerfile
          --ignorefile packages/signin/Dockerfile.dockerignore --depot --ha=false
          --image-label "signin-${{ github.event.workflow_run.head_sha }}"
