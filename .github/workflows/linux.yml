name: Linux

# The boot, server and storage suites and the image acceptance are expensive, so they skip changes that
# cannot affect them. Anything not listed here runs them, so new files are covered by default. Markdown
# under packages/ still runs them: server pages ship in the board image.
on:
  pull_request:
    paths-ignore:
      - packages/cloud/**
      - packages/landing/**
      - docs/**
      - repos/**
      - skills/**
      - "*.md"
      - LICENSE
      - .github/workflows/checks.yml
      - .github/workflows/cloud.yml
      - .github/workflows/deploy-cloud.yml
      - .github/workflows/release-latest.yml
  push:
    branches: [master]
    paths-ignore:
      - packages/cloud/**
      - packages/landing/**
      - docs/**
      - repos/**
      - skills/**
      - "*.md"
      - LICENSE
      - .github/workflows/checks.yml
      - .github/workflows/cloud.yml
      - .github/workflows/deploy-cloud.yml
      - .github/workflows/release-latest.yml

permissions:
  contents: read

concurrency:
  group: linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - name: Install declared Bun release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --output bun.zip \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          printf '%s\n' '2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452  bun.zip' | sha256sum --check -
          unzip -q bun.zip
          printf '%s\n' "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify runtimes
        run: |
          test "$(node --version)" = 'v22.22.3'
          test "$(bun --revision)" = '1.4.0+34cbb9a40'
          node --version
          bun --revision
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Boot, server and storage recovery tests
        # Each file launches Bun processes; four workers exceeded measured fixture budgets on this runner.
        run: bun run test packages/boot/test packages/server/test packages/storage/test --maxWorkers=2 --shard=${{ matrix.shard }}/6 --reporter=verbose

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build isolated runtime image
        run: docker build --tag chirp:acceptance .
      - name: Linux privileged keeper closure acceptance
        run: sh scripts/linux-keeper-acceptance.sh chirp:acceptance
      - name: Linux UID and persistence acceptance
        run: sh scripts/smoke-image.sh chirp:acceptance
